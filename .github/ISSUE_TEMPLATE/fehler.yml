name: Fehler melden / Report a bug
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. Deutsch oder Englisch, beides ist willkommen.

        **Bitte keine persönlichen Daten hineinschreiben.** Dieses
        Repository ist öffentlich – Namen, Telefonnummern oder Adressen aus
        deiner Visitenkarte sind hier für jeden lesbar. Für alles, was nicht
        öffentlich stehen soll: qrcode@cyb8.de
  - type: textarea
    id: was
    attributes:
      label: Was passiert?
      description: Was du erlebst, und was du stattdessen erwartet hättest.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Wie lässt sich es auslösen?
      placeholder: |
        1. App öffnen
        2. …
        3. …
    validations:
      required: false
  - type: dropdown
    id: plattform
    attributes:
      label: Gerät
      options:
        - Android
        - iPhone / iPad
        - Beides
        - Weiß nicht
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fassung der App
      description: Steht in der App unten auf der Einstellungsseite, z. B. 1.0.5.
      placeholder: "1.0.5"
  - type: input
    id: system
    attributes:
      label: Betriebssystem
      placeholder: "Android 15 / iOS 18.2"
